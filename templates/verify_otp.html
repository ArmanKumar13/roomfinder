{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <!-- Header -->

            <div class="text-center mb-4">

                <div class="mb-3">
                    <i class="bi bi-shield-check text-success"
                       style="font-size: 3rem;">
                    </i>
                </div>

                <h2 class="fw-bold">
                    Verify OTP
                </h2>

                <p class="text-muted">
                    Enter the OTP generated for your password reset.
                </p>

            </div>


            <!-- Card -->

            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <span class="badge bg-success-subtle text-success px-3 py-2">
                            <i class="bi bi-key-fill me-1"></i>
                            OTP Verification
                        </span>

                    </div>


                    <!-- OTP Form -->

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                <i class="bi bi-123 me-1"></i>
                                Enter OTP
                            </label>

                            <input
                                type="text"
                                name="otp"
                                class="form-control form-control-lg text-center"
                                placeholder="Enter 6-digit OTP"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100"
                        >

                            <i class="bi bi-check-circle me-2"></i>
                            Verify OTP

                        </button>

                    </form>


                    <hr class="my-4">


                    <!-- Resend OTP -->

                    <div class="text-center">

                        <p
                            id="timer"
                            class="text-danger mb-2"
                        >
                            Resend OTP in 60 seconds
                        </p>

                        <a
                            href="/resend-otp"
                            id="resendBtn"
                            class="btn btn-link disabled text-decoration-none"
                        >
                            <i class="bi bi-arrow-repeat me-1"></i>
                            Resend OTP
                        </a>

                    </div>


                    <div class="text-center mt-3">

                        <a
                            href="/forgot-password"
                            class="text-decoration-none"
                        >
                            <i class="bi bi-arrow-left me-1"></i>
                            Change Email
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

let seconds = 60;

const timer = document.getElementById("timer");
const resend = document.getElementById("resendBtn");

const interval = setInterval(function () {

    seconds--;

    timer.innerHTML =
        "Resend OTP in " + seconds + " seconds";

    if (seconds <= 0) {

        clearInterval(interval);

        timer.innerHTML = "";

        resend.classList.remove("disabled");

    }

}, 1000);

</script>

{% endblock %}
